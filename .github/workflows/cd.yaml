name: cd

# Сборка и выкладка только для коммита, на котором успешно прошли ВСЕ проверки workflow `ci`:
# запускается по завершению ci для push в main и берёт ровно тот же SHA (head_sha), а не «текущий main».
# PR (в том числе из форков) сюда не попадают: ни секретов, ни self-hosted runner им недоступны.
on:
  workflow_run:
    workflows: [ "ci" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: grayhex
  IMAGE_API: afterlight-api
  IMAGE_WEB: afterlight-web
  SHA: ${{ github.event.workflow_run.head_sha }}

# Выкладки не отменяем на середине: следующая ждёт своей очереди
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  # Повторный запуск старого успешного ci тоже даёт workflow_run (push, main, success) для УСТАРЕВШЕГО коммита.
  # Выкладываем только если head_sha — всё ещё вершина main, иначе откатили бы прод на старую версию.
  gate:
    name: is-current-main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Compare head_sha with the current tip of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main")
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SHA is not the tip of main ($tip): this run is stale (a re-run of an older ci?), nothing is built or deployed"
          fi

  build:
    name: build-and-push
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_API }}:${{ env.SHA }}
          provenance: false

      - name: Build & push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_WEB }}:${{ env.SHA }}
          provenance: false

  deploy:
    name: deploy-to-k3s
    runs-on: self-hosted
    needs: build
    # environment production позволяет владельцу включить обязательное подтверждение выкладки в настройках репозитория
    environment: production
    if: ${{ !contains(github.event.workflow_run.head_commit.message, '[skip cd]') }}
    env:
      NS: afterlight
    steps:
      # пока шла сборка, в main мог попасть более новый коммит: тогда его собственный запуск cd выложит его, а этот — нет
      - name: Still the tip of main?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main")
          if [ "$tip" != "$SHA" ]; then
            echo "::error::$SHA is no longer the tip of main ($tip): refusing to deploy a superseded revision"
            exit 1
          fi

      - name: Write kubeconfig from secret
        run: |
          mkdir -p "$HOME/.kube"
          printf "%s" "${{ secrets.KUBECONFIG_AFTERLIGHT }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Check kubectl and kubeconfig
        run: |
          kubectl version --client
          kubectl config current-context

      - name: Deploy API & WEB (set image or restart)
        env:
          NEW_API: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_API }}:${{ env.SHA }}
          NEW_WEB: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_WEB }}:${{ env.SHA }}
        run: |
          set -euo pipefail

          echo "=== API ==="
          CUR_API=$(kubectl -n "$NS" get deploy/afterlight-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')
          echo "Current: $CUR_API"
          echo "New:     $NEW_API"
          if [ "$CUR_API" = "$NEW_API" ]; then
            echo "Image unchanged -> rollout restart (API)"
            kubectl -n "$NS" rollout restart deploy/afterlight-api
          else
            echo "Updating image (API)"
            kubectl -n "$NS" set image deploy/afterlight-api api="$NEW_API"
          fi

          echo "=== WEB ==="
          CUR_WEB=$(kubectl -n "$NS" get deploy/afterlight-web -o jsonpath='{.spec.template.spec.containers[?(@.name=="web")].image}')
          echo "Current: $CUR_WEB"
          echo "New:     $NEW_WEB"
          if [ "$CUR_WEB" = "$NEW_WEB" ]; then
            echo "Image unchanged -> rollout restart (WEB)"
            kubectl -n "$NS" rollout restart deploy/afterlight-web
          else
            echo "Updating image (WEB)"
            kubectl -n "$NS" set image deploy/afterlight-web web="$NEW_WEB"
          fi

      - name: Wait for rollout
        run: |
          set -e
          kubectl -n $NS rollout status deploy/afterlight-api
          kubectl -n $NS rollout status deploy/afterlight-web

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n $NS describe deploy/afterlight-api || true
          kubectl -n $NS describe deploy/afterlight-web || true
          kubectl -n $NS describe pods -l app=afterlight-api || true
          kubectl -n $NS describe pods -l app=afterlight-web || true
          kubectl -n $NS logs deploy/afterlight-api --all-containers --tail=200 || true
          kubectl -n $NS logs deploy/afterlight-web --all-containers --tail=200 || true
          kubectl -n $NS get events --sort-by='.lastTimestamp' | tail -n 50 || true
