name: cd

# Сборка и выкладка только для коммита, на котором успешно прошли ВСЕ проверки workflow `ci`:
# запускается по завершению ci для push в main и берёт ровно тот же SHA (head_sha), а не «текущий main».
# PR (в том числе из форков) сюда не попадают: ни секретов, ни self-hosted runner им недоступны.
on:
  workflow_run:
    workflows: [ "ci" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: grayhex
  IMAGE_API: afterlight-api
  IMAGE_WEB: afterlight-web
  SHA: ${{ github.event.workflow_run.head_sha }}

# Выкладки не отменяем на середине: следующая ждёт своей очереди. Запуски одной группы идут строго по очереди,
# поэтому более новый коммит не может быть выложен раньше предыдущего и затем перезаписан им.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  # Повторный запуск старого успешного ci тоже даёт workflow_run (push, main, success) для УСТАРЕВШЕГО коммита.
  # SHA считается актуальным, если он — вершина main ИЛИ после него в main менялись только файлы, которые не запускают ci
  # (тот же список, что paths-ignore в ci.yml: у такого коммита нет собственного запуска cd, и выкладывать код больше некому).
  # Иначе это устаревшая версия: у более нового кода свой запуск cd, и откатывать на старую нельзя.
  gate:
    name: is-current-main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Is head_sha still the latest deployable revision of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$@"; }
          tip=$(api -H "Accept: application/vnd.github.sha" "https://api.github.com/repos/${{ github.repository }}/commits/main")
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cmp=$(api "https://api.github.com/repos/${{ github.repository }}/compare/$SHA...$tip?per_page=100")
          status=$(jq -r .status <<<"$cmp")
          nfiles=$(jq '.files | length' <<<"$cmp")
          # файлы, не запускающие ci (синхронизировать с on.push.paths-ignore в ci.yml)
          deployable=$(jq -r '.files[].filename' <<<"$cmp" \
            | grep -Ev '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE|^LICENSE)' || true)
          if [ "$status" = "ahead" ] && [ "$nfiles" -lt 300 ] && [ -z "$deployable" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved to $tip, but only documentation changed since $SHA: deploying $SHA"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SHA is superseded by $tip (status=$status): stale run (re-run of an older ci?), nothing is built or deployed"
          fi

  build:
    name: build-and-push
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_API }}:${{ env.SHA }}
          provenance: false

      - name: Build & push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_WEB }}:${{ env.SHA }}
          provenance: false

  deploy:
    name: deploy-to-k3s
    runs-on: self-hosted
    needs: build
    # environment production позволяет владельцу включить обязательное подтверждение выкладки в настройках репозитория
    environment: production
    # k3s признан избыточным (D9, docs/mvp-contract.md): выкладка в k3s по умолчанию выключена,
    # включается переменной репозитория K3S_DEPLOY=true. Сборка и публикация образов выполняются всегда.
    if: ${{ vars.K3S_DEPLOY == 'true' && !contains(github.event.workflow_run.head_commit.message, '[skip cd]') }}
    env:
      NS: afterlight
    steps:
      - name: Write kubeconfig from secret
        run: |
          mkdir -p "$HOME/.kube"
          printf "%s" "${{ secrets.KUBECONFIG_AFTERLIGHT }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Check kubectl and kubeconfig
        run: |
          kubectl version --client
          kubectl config current-context

      - name: Deploy API & WEB (set image or restart)
        env:
          NEW_API: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_API }}:${{ env.SHA }}
          NEW_WEB: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_WEB }}:${{ env.SHA }}
        run: |
          set -euo pipefail

          echo "=== API ==="
          CUR_API=$(kubectl -n "$NS" get deploy/afterlight-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')
          echo "Current: $CUR_API"
          echo "New:     $NEW_API"
          if [ "$CUR_API" = "$NEW_API" ]; then
            echo "Image unchanged -> rollout restart (API)"
            kubectl -n "$NS" rollout restart deploy/afterlight-api
          else
            echo "Updating image (API)"
            kubectl -n "$NS" set image deploy/afterlight-api api="$NEW_API"
          fi

          echo "=== WEB ==="
          CUR_WEB=$(kubectl -n "$NS" get deploy/afterlight-web -o jsonpath='{.spec.template.spec.containers[?(@.name=="web")].image}')
          echo "Current: $CUR_WEB"
          echo "New:     $NEW_WEB"
          if [ "$CUR_WEB" = "$NEW_WEB" ]; then
            echo "Image unchanged -> rollout restart (WEB)"
            kubectl -n "$NS" rollout restart deploy/afterlight-web
          else
            echo "Updating image (WEB)"
            kubectl -n "$NS" set image deploy/afterlight-web web="$NEW_WEB"
          fi

      - name: Wait for rollout
        run: |
          set -e
          kubectl -n $NS rollout status deploy/afterlight-api
          kubectl -n $NS rollout status deploy/afterlight-web

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n $NS describe deploy/afterlight-api || true
          kubectl -n $NS describe deploy/afterlight-web || true
          kubectl -n $NS describe pods -l app=afterlight-api || true
          kubectl -n $NS describe pods -l app=afterlight-web || true
          kubectl -n $NS logs deploy/afterlight-api --all-containers --tail=200 || true
          kubectl -n $NS logs deploy/afterlight-web --all-containers --tail=200 || true
          kubectl -n $NS get events --sort-by='.lastTimestamp' | tail -n 50 || true
