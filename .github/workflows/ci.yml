name: ci
on:
  push:
    branches: [ main ]
    # как раньше в cd: документация не запускает проверки и, следовательно, выкладку
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - "LICENSE*"
  pull_request:
    branches: [ main ]

# Только чтение: проверки PR (в том числе из форков) не получают ни секретов, ни прав на запись,
# работают на GitHub-hosted runner.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afterlight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Имя БД содержит "test": integration-тесты очищают таблицы и отказываются работать с другой БД
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/afterlight_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      CORS_ALLOWED_ORIGINS: http://localhost:3001
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      # Только по lock-файлу, без fallback на npm i
      - name: Install deps
        run: npm ci

      - name: Prisma validate / format
        run: |
          npx prisma validate
          npx prisma format --check

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (Nest)
        run: npm run build

      - name: openapi.json is up to date
        run: |
          npm run openapi
          git diff --exit-code -- openapi.json

      - name: Unit tests (mocks)
        run: npm run test:unit

      - name: Migrate from scratch
        run: npx prisma migrate deploy

      - name: Schema matches migrations (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed
        run: npx prisma db seed

      - name: Integration tests (real PostgreSQL, real guards)
        run: npm run test:integration

  migrations-upgrade:
    name: migrations-upgrade
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afterlight_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/afterlight_upgrade?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout base branch (previous DB state)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pr/apps/api/package-lock.json

      - name: Install deps
        working-directory: pr/apps/api
        run: npm ci

      # БД в состоянии base-ветки: её миграции применяются CLI текущей версии через временный config
      - name: Apply base migrations
        working-directory: pr/apps/api
        run: |
          cat > prisma.base.config.ts <<'CFG'
          import { defineConfig, env } from 'prisma/config';
          export default defineConfig({
            schema: 'prisma/schema.prisma',
            migrations: { path: '../../../base/apps/api/prisma/migrations' },
            datasource: { url: env('DATABASE_URL') },
          });
          CFG
          npx prisma migrate deploy --config prisma.base.config.ts
          rm prisma.base.config.ts

      - name: Apply PR migrations on top
        working-directory: pr/apps/api
        run: npx prisma migrate deploy

      - name: No drift after upgrade
        working-directory: pr/apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps (web)
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  containers:
    name: containers-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Образы собираются теми же Dockerfile, что и для выкладки; поднимается стек из docker-compose.server.yml
      # (PostgreSQL + migrate + api + web) и проходится основной путь через web-прокси.
      - name: Smoke (build, migrate, health, register/login, cabinet, seed)
        run: scripts/smoke-compose.sh
