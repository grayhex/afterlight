name: DB Migrate

# Только применение уже закоммиченных миграций (prisma migrate deploy). Создавать миграции на рабочей БД из CI нельзя:
# их пишут в PR (prisma migrate dev локально), проверяют в ci и только потом применяют.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напиши: prod (подтверждаю применение миграций к БД из секрета DATABASE_URL)'
        required: true
        default: 'no'

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'prod' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      # строго по lock-файлу: никаких npm i, меняющих версии на лету
      - name: Install deps
        run: npm ci
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
