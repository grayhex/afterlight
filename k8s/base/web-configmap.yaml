apiVersion: v1
kind: ConfigMap
metadata:
  name: afterlight-web-config
  namespace: afterlight
data:
  NODE_ENV: "production"
  PORT: "3000"
  NEXT_PUBLIC_API_BASE: "https://api.afterl.ru"
  # web проксирует /api/* сюда (рантайм): внутренний адрес сервиса API в том же namespace; проверьте имя/порт своего Service
  API_INTERNAL_URL: "http://afterlight-api:8080"
  NEXT_PUBLIC_DEFAULT_USER_ID: "00000000-0000-4000-8000-000000000001"
