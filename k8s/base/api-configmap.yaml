apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: afterlight-staging
data:
  NODE_ENV: "production"
  PORT: "3000"
  PUBLIC_BASE_URL: "https://staging.afterlight.example"
  # внешний адрес веба для ссылок в письмах; в production без него API не стартует (замените на свой)
  WEB_BASE_URL: "https://app.afterlight.example"
  CORS_ALLOWED_ORIGINS: "https://app.afterlight.example"
  JSON_BODY_LIMIT: "100kb"
